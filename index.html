<title>Simulador de Bloqueio</title>
<style>
:root{
  /* Paleta oficial do painel Zarks: fundo preto, cards grafite, verde-ciano neon como destaque */
  --neon-cyan:#00C897; --neon-cyan-dim:rgba(0,200,151,.12); --neon-red:#E84545;
  --bg-main:#000000; --bg-card:#1A1D21; --border-color:#2A2F35;
  --text-primary:#FFFFFF; --text-secondary:#B0B8C8; --text-muted:#64748b;
  --overlay:rgba(0,0,0,.72);
  --font-display:'Inter',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
/* Tema escuro deliberado (espelha o painel); não inverte em light mode. */
:root{ color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg-main); font-family:var(--font-display);
  display:flex; align-items:center; justify-content:center; padding:20px 14px;
}

.card{
  width:100%; max-width:320px; background:var(--bg-card); border:1px solid var(--border-color);
  border-radius:18px; padding:18px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(0,200,151,.06);
  display:flex; flex-direction:column; gap:16px;
}

.card-title{
  font-weight:800; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--neon-cyan);
  text-align:center;
}

.mode-switch{
  display:flex; background:var(--bg-main); border:1px solid var(--border-color); border-radius:9px;
  padding:3px; gap:3px;
}
.mode-switch button{
  flex:1; border:0; background:transparent; color:var(--text-secondary); font:inherit; font-size:12.5px; font-weight:700;
  padding:8px 0; border-radius:7px; cursor:pointer; transition:.15s;
}
.mode-switch button.active{background:var(--neon-cyan); color:#001A12}

/* ============ main area: stacks on phone, sits side-by-side from tablet up ============ */
.stage{display:flex; flex-direction:column; align-items:center; gap:16px}
@media (min-width:600px){
  .card{max-width:560px}
  .stage{flex-direction:row; align-items:flex-start; justify-content:center; gap:22px}
}
@media (min-width:900px){
  .card{max-width:620px; padding:22px}
}

/* ============ realistic phone mockup ============ */
.phone-col{flex-shrink:0; display:flex; justify-content:center}
.phone{
  width:clamp(170px, 46vw, 208px);
  aspect-ratio:9/19.5;
  background:linear-gradient(155deg,#2c2f34,#0c0d0f 60%);
  border-radius:15% / 7%;
  padding:9px;
  position:relative;
  box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.04);
}
/* side buttons for realism */
.phone::before{ /* power button */
  content:""; position:absolute; right:-2px; top:19%; width:3px; height:9%;
  background:#050506; border-radius:2px 0 0 2px;
}
.phone::after{ /* volume rocker */
  content:""; position:absolute; left:-2px; top:14%; width:3px; height:15%;
  background:#050506; border-radius:0 2px 2px 0;
}
.screen{
  width:100%; height:100%;
  background:
    radial-gradient(140% 70% at 50% 0%, rgba(0,200,151,.07), transparent 55%),
    radial-gradient(100% 60% at 50% 100%, #05080a, transparent 60%),
    linear-gradient(185deg, #15191d, #060708 65%);
  border-radius:12% / 5.5%;
  overflow:hidden;
  position:relative;
  display:flex; flex-direction:column; align-items:center;
  padding:9% 10% 6%;
}
.statusbar{
  position:absolute; top:0; left:0; right:0; height:7%;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 7%;
}
.statusbar .time-mini{font-family:var(--font-mono); font-size:clamp(7px,1.6vw,8.5px); color:rgba(255,255,255,.85); font-weight:600}
.statusbar .icons{display:flex; align-items:center; gap:3px}
.statusbar svg{width:clamp(9px,2vw,11px); height:auto; display:block}
.camera-dot{
  position:absolute; top:3%; left:50%; transform:translateX(-50%);
  width:7%; aspect-ratio:1; border-radius:50%;
  background:#000; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}

.clock{color:var(--text-primary); text-align:center; margin-top:4%; margin-bottom:5%}
.clock .time{font-size:clamp(20px,6.2vw,27px); font-weight:700; line-height:1; letter-spacing:-.02em; font-family:var(--font-mono)}
.clock .date{font-size:clamp(7.5px,1.9vw,9px); color:var(--text-muted); margin-top:5px; text-transform:capitalize; font-weight:500}
.lock-icon{margin-top:7%; opacity:.5}
.lock-icon svg{width:clamp(10px,2.4vw,13px); height:auto; display:block}

.dots-row{display:flex; gap:6px; justify-content:center; height:8px; margin:7% 0 5%}
.dots-row .d{width:6px; height:6px; border-radius:50%; background:var(--border-color); transition:.12s}
.dots-row .d.filled{background:var(--neon-cyan); transform:scale(1.15); box-shadow:0 0 6px var(--neon-cyan-dim)}
.dots-row .d.err{background:var(--neon-red)}

.pattern-wrap{position:relative; width:62%; aspect-ratio:1; margin:4% auto 0; flex-shrink:0}
.pattern-wrap svg.line-svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.pattern-grid{
  position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  place-items:center;
}
.pnode{width:100%; height:100%; display:flex; align-items:center; justify-content:center}
.pnode .dot{
  width:22%; height:22%; min-width:9px; min-height:9px; border-radius:50%;
  border:1.4px solid var(--border-color); background:rgba(255,255,255,.03);
  transition:.1s; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:6.5px; font-weight:600; color:var(--text-muted);
}
.pnode.active .dot{background:var(--neon-cyan); border-color:var(--neon-cyan); transform:scale(1.2); box-shadow:0 0 0 4px var(--neon-cyan-dim); color:#001A12}
.pnode.err .dot{background:var(--neon-red); border-color:var(--neon-red)}

.status-line{margin-top:auto; padding-top:6%; font-size:clamp(8.5px,2vw,10px); font-weight:700; height:14px; text-align:center; font-family:var(--font-mono)}
.status-line.ok{color:var(--neon-cyan)}
.status-line.bad{color:var(--neon-red)}
.status-line.neutral{color:var(--text-muted)}

.home-indicator{
  position:absolute; bottom:1.6%; left:50%; transform:translateX(-50%);
  width:28%; height:3px; border-radius:3px; background:rgba(255,255,255,.3);
}

/* ============ controls: beside the phone from tablet up ============ */
.controls{width:100%; max-width:220px; display:flex; flex-direction:column; align-items:stretch; gap:10px}
.controls .hint{font-size:11px; color:var(--text-secondary); text-align:center; font-weight:500}

.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%}
.keypad button{
  aspect-ratio:1.4; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-primary);
  font-family:var(--font-mono); font-size:15px; font-weight:700; cursor:pointer; transition:.08s;
}
.keypad button:active{transform:scale(.93); background:var(--neon-cyan); color:#001A12; border-color:var(--neon-cyan)}
.keypad button.wide{font-size:10px; font-weight:700; color:var(--text-muted)}
.keypad button.used{background:var(--neon-cyan-dim); border-color:var(--neon-cyan); color:var(--neon-cyan)}

.action-row{display:flex; gap:8px; width:100%}
.action-row button{
  flex:1; padding:10px 8px; border-radius:10px; font-size:11.5px; font-weight:700; font-family:var(--font-display);
  cursor:pointer; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-primary);
  transition:.12s;
}
.action-row button:hover{border-color:var(--neon-cyan); color:var(--neon-cyan)}
.action-row button.primary{background:var(--neon-cyan); border-color:var(--neon-cyan); color:#001A12}
.action-row button.primary:hover{color:#001A12}
.action-row button.primary:active{background:#00a97f}

footer.note{
  font-size:10px; color:var(--text-muted); line-height:1.5; text-align:center;
}
</style>

<div class="card">
  <div class="card-title">Simulador de bloqueio</div>

  <div class="mode-switch" role="tablist">
    <button id="tabPin" class="active" role="tab" aria-selected="true">PIN</button>
    <button id="tabPattern" role="tab" aria-selected="false">Padrão</button>
  </div>

  <div class="stage">
    <div class="phone-col">
      <div class="phone">
        <div class="screen">
          <div class="statusbar">
            <div class="time-mini" id="statusTime">19:59</div>
            <div class="icons">
              <svg viewBox="0 0 16 10" fill="none"><path d="M1 8.5h1.5V6H1v2.5ZM4 8.5h1.5V4H4v4.5ZM7 8.5h1.5V2H7v6.5ZM10 8.5h1.5V1H10v7.5Z" fill="rgba(255,255,255,.85)"/></svg>
              <svg viewBox="0 0 16 12" fill="none"><rect x="1" y="3" width="11" height="6" rx="1.5" stroke="rgba(255,255,255,.85)" stroke-width="1"/><rect x="13" y="4.5" width="1.4" height="3" rx="0.5" fill="rgba(255,255,255,.85)"/><rect x="2" y="4" width="8" height="4" rx="0.5" fill="rgba(255,255,255,.85)"/></svg>
            </div>
          </div>
          <div class="camera-dot"></div>

          <div class="clock">
            <div class="time" id="clockTime">--:--</div>
            <div class="date" id="clockDate">—</div>
          </div>
          <div class="lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>

          <div id="pinMode" style="width:100%; display:flex; flex-direction:column; align-items:center">
            <div class="dots-row" id="pinDots"></div>
          </div>

          <div id="patternMode" hidden style="width:100%; display:flex; flex-direction:column; align-items:center">
            <div class="pattern-wrap" id="patternWrap">
              <svg class="line-svg" id="patternSvg" viewBox="0 0 150 150"><polyline id="patternLine" points="" fill="none" stroke="#00C897" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <div class="pattern-grid" id="patternGrid"></div>
            </div>
          </div>

          <div class="status-line neutral" id="statusLine">&nbsp;</div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="hint" id="controlsHint">Digite o PIN (mín. 4 dígitos)</div>

      <div id="pinControls">
        <div class="keypad" id="keypad"></div>
      </div>

      <div id="patternControls" hidden style="width:100%">
        <div class="keypad" id="patternKeypad"></div>
      </div>

      <div class="action-row">
        <button type="button" id="btnUndo">apagar</button>
        <button type="button" id="btnConfirm" class="primary">desbloquear</button>
      </div>
      <div class="action-row">
        <button type="button" id="btnReset">limpar</button>
        <button type="button" id="btnSetAsCorrect">definir senha</button>
      </div>
    </div>
  </div>

  <footer class="note">Roda só no seu navegador — nada é enviado nem salvo.</footer>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
(function(){
  "use strict";

  function paintClock(){
    var now = new Date();
    var hh = String(now.getHours()).padStart(2,'0');
    var mm = String(now.getMinutes()).padStart(2,'0');
    var t = hh+':'+mm;
    document.getElementById('clockTime').textContent = t;
    document.getElementById('statusTime').textContent = t;
    var days=['dom','seg','ter','qua','qui','sex','sáb'];
    var months=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    document.getElementById('clockDate').textContent = days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()];
  }
  paintClock(); setInterval(paintClock, 15000);

  var state = {
    mode: 'pin',
    correctPin: '1234',
    correctPattern: [0,1,2,5,8],
    pinBuffer: '',
    patternPath: []
  };

  var tabPin = document.getElementById('tabPin');
  var tabPattern = document.getElementById('tabPattern');
  var pinMode = document.getElementById('pinMode');
  var patternMode = document.getElementById('patternMode');
  var pinControls = document.getElementById('pinControls');
  var patternControls = document.getElementById('patternControls');
  var controlsHint = document.getElementById('controlsHint');
  var statusEl = document.getElementById('statusLine');

  function setMode(mode){
    state.mode = mode;
    clearAttempt();
    if(mode==='pin'){
      tabPin.classList.add('active'); tabPin.setAttribute('aria-selected','true');
      tabPattern.classList.remove('active'); tabPattern.setAttribute('aria-selected','false');
      pinMode.hidden=false; patternMode.hidden=true;
      pinControls.hidden=false; patternControls.hidden=true;
      controlsHint.textContent = 'Digite o PIN (mín. 4 dígitos)';
    } else {
      tabPattern.classList.add('active'); tabPattern.setAttribute('aria-selected','true');
      tabPin.classList.remove('active'); tabPin.setAttribute('aria-selected','false');
      pinMode.hidden=true; patternMode.hidden=false;
      pinControls.hidden=true; patternControls.hidden=false;
      controlsHint.textContent = 'Toque os números na ordem do desenho';
    }
  }
  tabPin.addEventListener('click', function(){ setMode('pin'); });
  tabPattern.addEventListener('click', function(){ setMode('pattern'); });

  // ---------- PIN ----------
  var pinDotsEl = document.getElementById('pinDots');
  var keypadEl = document.getElementById('keypad');

  function renderPinDots(){
    pinDotsEl.innerHTML='';
    var max = Math.max(4, state.pinBuffer.length);
    for(var i=0;i<max;i++){
      var d=document.createElement('div');
      d.className='d'+(i<state.pinBuffer.length?' filled':'');
      pinDotsEl.appendChild(d);
    }
  }

  var keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(function(k){
    var btn = document.createElement('button');
    if(k===''){ btn.className='wide'; btn.disabled=true; btn.style.visibility='hidden'; }
    else if(k==='⌫'){ btn.className='wide'; btn.textContent='apagar'; }
    else { btn.textContent=k; }
    btn.addEventListener('click', function(){
      if(k==='⌫'){ state.pinBuffer = state.pinBuffer.slice(0,-1); renderPinDots(); setStatus('',''); return; }
      if(k==='') return;
      if(state.pinBuffer.length>=8) return;
      state.pinBuffer += k;
      renderPinDots();
      setStatus('','');
    });
    keypadEl.appendChild(btn);
  });
  renderPinDots();

  function checkPin(){
    if(state.pinBuffer.length < 4){
      setStatus('Digite ao menos 4 dígitos','bad');
      return;
    }
    if(state.pinBuffer === state.correctPin){
      setStatus('Desbloqueado','ok');
      flashDots(true);
    } else {
      setStatus('PIN incorreto','bad');
      flashDots(false);
      setTimeout(function(){ state.pinBuffer=''; renderPinDots(); }, 500);
    }
  }
  function flashDots(ok){
    var dots = pinDotsEl.querySelectorAll('.d');
    dots.forEach(function(d){ if(!ok) d.classList.add('err'); });
    setTimeout(function(){ dots.forEach(function(d){ d.classList.remove('err'); }); }, 480);
  }

  // ---------- Pattern ----------
  var patternGrid = document.getElementById('patternGrid');
  var patternLine = document.getElementById('patternLine');
  var patternKeypad = document.getElementById('patternKeypad');
  var nodes = [];
  for(var i=0;i<9;i++){
    var n = document.createElement('div');
    n.className='pnode'; n.dataset.idx=i;
    var dot=document.createElement('div'); dot.className='dot'; dot.textContent = i+1;
    n.appendChild(dot);
    patternGrid.appendChild(n);
    nodes.push(n);
  }

  var keypadBtns = [];
  for(var k=1;k<=9;k++){
    (function(digit){
      var btn = document.createElement('button');
      btn.type='button'; btn.textContent = digit;
      btn.addEventListener('click', function(){ addPatternPoint(digit-1); });
      patternKeypad.appendChild(btn);
      keypadBtns.push(btn);
    })(k);
  }

  function nodeCenter(idx){
    var col = idx%3, row = Math.floor(idx/3);
    var cellW = 150/3;
    return { x: cellW*col + cellW/2, y: cellW*row + cellW/2 };
  }

  function updatePatternVisual(){
    nodes.forEach(function(n,i){ n.classList.toggle('active', state.patternPath.indexOf(i) !== -1); });
    keypadBtns.forEach(function(b,i){ b.classList.toggle('used', state.patternPath.indexOf(i) !== -1); });
    var pts = state.patternPath.map(function(i){ var c=nodeCenter(i); return c.x+','+c.y; }).join(' ');
    patternLine.setAttribute('points', pts);
  }

  function addPatternPoint(idx){
    if(state.patternPath.indexOf(idx) !== -1) return;
    state.patternPath.push(idx);
    updatePatternVisual();
    setStatus('','');
  }

  function checkPattern(){
    if(state.patternPath.length < 4){
      setStatus('Mín. 4 pontos','bad');
      return;
    }
    var same = state.patternPath.length===state.correctPattern.length &&
      state.patternPath.every(function(v,i){ return v===state.correctPattern[i]; });
    if(same){
      setStatus('Desbloqueado','ok');
    } else {
      setStatus('Padrão incorreto','bad');
      nodes.forEach(function(n,i){ if(state.patternPath.indexOf(i)!==-1) n.classList.add('err'); });
      setTimeout(function(){
        nodes.forEach(function(n){ n.classList.remove('err'); });
        state.patternPath=[]; updatePatternVisual();
      }, 650);
    }
  }

  // ---------- shared ----------
  function setStatus(text, cls){
    statusEl.textContent = text || ' ';
    statusEl.className = 'status-line ' + (cls||'neutral');
  }

  function clearAttempt(){
    state.pinBuffer=''; state.patternPath=[];
    renderPinDots(); updatePatternVisual();
    setStatus('','');
  }

  document.getElementById('btnReset').addEventListener('click', clearAttempt);

  document.getElementById('btnUndo').addEventListener('click', function(){
    if(state.mode==='pin'){
      state.pinBuffer = state.pinBuffer.slice(0,-1);
      renderPinDots();
    } else {
      state.patternPath.pop();
      updatePatternVisual();
    }
    setStatus('','');
  });

  document.getElementById('btnConfirm').addEventListener('click', function(){
    if(state.mode==='pin'){ checkPin(); } else { checkPattern(); }
  });

  document.getElementById('btnSetAsCorrect').addEventListener('click', function(){
    if(state.mode==='pin'){
      if(state.pinBuffer.length>=4){
        state.correctPin = state.pinBuffer;
        state.pinBuffer='';
        renderPinDots();
        setStatus('Nova senha definida','ok');
      } else {
        setStatus('Digite 4+ dígitos antes','bad');
      }
    } else {
      if(state.patternPath.length>=4){
        state.correctPattern = state.patternPath.slice();
        state.patternPath=[];
        updatePatternVisual();
        setStatus('Novo padrão definido','ok');
      } else {
        setStatus('Toque 4+ pontos antes','bad');
      }
    }
  });

  updatePatternVisual();
})();
</script>
